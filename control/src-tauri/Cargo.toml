[package]
name = "exvram-control"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Local control panel for an existing llama.cpp server"
publish = false

[lib]
name = "exvram_control"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
exvram-control-core = { path = "../core" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
